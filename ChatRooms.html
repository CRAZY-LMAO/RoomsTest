<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple Photon Chat</title>

<script src="https://unpkg.com/photon-realtime@4.1.1.3/dist/PhotonRealtime.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
}

.box {
    background: white;
    width: 300px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 8px;
}

input {
    width: 90%;
    padding: 5px;
    margin: 5px;
}

button {
    padding: 6px 10px;
    margin: 5px;
}

#chat {
    height: 150px;
    overflow-y: auto;
    border: 1px solid black;
    text-align: left;
    padding: 5px;
    margin-bottom: 5px;
}

</style>

</head>
<body>

<div class="box">

<h3>Photon Chat</h3>

<input id="username" placeholder="Username">
<br>
<button onclick="connect()">Connect</button>

<hr>

<input id="room" placeholder="Room name">
<br>
<button onclick="createRoom()">Create</button>
<button onclick="joinRoom()">Join</button>

<hr>

<div id="chat"></div>

<input id="msg" placeholder="Message">
<br>
<button onclick="send()">Send</button>

</div>


<script>

const APP_ID = "b82782de-8bb2-478a-8a94-0ca9c705a926";

let client;
let name = "";


function log(t){
    let c = document.getElementById("chat");
    c.innerHTML += t + "<br>";
    c.scrollTop = c.scrollHeight;
}


function connect(){

    name = document.getElementById("username").value;

    client = new Photon.LoadBalancing.LoadBalancingClient(
        Photon.ConnectionProtocol.Wss,
        APP_ID,
        "1.0"
    );

    client.myActor().setName(name);

    client.onStateChange = function(state){

        if(state === 1) log("Connecting...");
        if(state === 5) log("Connected");
        if(state === 10) log("Joined room");

    };

    client.onEvent = function(code, content){

        if(code === 1){
            log(content);
        }

    };

    client.connectToRegionMaster("eu");

}


function createRoom(){

    let r = document.getElementById("room").value;
    client.createRoom(r);

}


function joinRoom(){

    let r = document.getElementById("room").value;
    client.joinRoom(r);

}


function send(){

    let m = document.getElementById("msg").value;

    client.raiseEvent(
        1,
        name + ": " + m
    );

}

</script>

</body>
</html>
